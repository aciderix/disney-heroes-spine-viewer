<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney Heroes — Spine Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
.app { display: flex; height: 100vh; }
.sidebar { width: 220px; background: #16213e; overflow-y: auto; border-right: 1px solid #0f3460; flex-shrink: 0; }
.sidebar h1 { font-size: 14px; padding: 16px; color: #e94560; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.char-list { list-style: none; }
.char-item { padding: 10px 16px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.char-item:hover { background: #0f3460; }
.char-item.active { background: #e94560; color: #fff; }
.char-thumb { width: 32px; height: 32px; border-radius: 6px; background: #0f3460; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.main { flex: 1; display: flex; flex-direction: column; }
.viewer-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #1a1a2e; }
#canvas { width: 100%; height: 100%; display: block; background: transparent; }
.loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #555; font-size: 14px; z-index: 10; }
.controls { background: #16213e; padding: 12px 20px; border-top: 1px solid #0f3460; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls select, .controls button, .controls input { background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a7a; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.controls button:hover { background: #1a4a7a; }
.controls button:disabled { opacity: 0.4; cursor: default; }
.controls label { font-size: 12px; color: #8899aa; }
.controls input[type="range"] { width: 80px; }
.anim-name { font-weight: 600; color: #e94560; }
.info-bar { background: #0d1b2a; padding: 6px 20px; font-size: 11px; color: #6a7a8a; display: flex; gap: 20px; }
.gif-status { color: #e94560; font-size: 12px; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>🎭 Disney Heroes</h1>
    <ul class="char-list" id="charList"></ul>
  </aside>
  <main class="main">
    <div class="info-bar" id="infoBar">Select a character</div>
    <div class="viewer-wrap">
      <canvas id="canvas"></canvas>
      <div class="loading" id="loading">Select a character to begin</div>
    </div>
    <div class="controls">
      <select id="skinSelect" disabled><option>Skin</option></select>
      <select id="animSelect" disabled><option>Animations</option></select>
      <button id="playBtn" disabled>⏸ Pause</button>
      <label>Speed</label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
      <span id="speedVal" style="font-size:12px;width:30px">1.0×</span>
      <button id="resetBtn" disabled>🔄 Reset Pose</button>
      <span class="gif-status" id="gifStatus"></span>
    </div>
  </main>
</div>

<script src="spine-webgl.js?v=9"></script>

<script>
// Character manifest
const CHARACTERS = [
  {name:'aladdin',display:'Aladdin',emoji:'🧞'},
  {name:'elsa',display:'Elsa',emoji:'❄️'},
  {name:'buzz_lightyear',display:'Buzz Lightyear',emoji:'🚀'},
  {name:'beast',display:'Beast',emoji:'🦁'},
  {name:'genie',display:'Genie',emoji:'🪔'},
  {name:'hades',display:'Hades',emoji:'🔥'},
  {name:'ariel',display:'Ariel',emoji:'🧜‍♀️'},
  {name:'baymax',display:'Baymax',emoji:'🤖'},
  {name:'captain_hook',display:'Captain Hook',emoji:'🪝'},
  {name:'dash',display:'Dash',emoji:'💨'},
  {name:'donald_duck',display:'Donald Duck',emoji:'🦆'},
  {name:'frozone',display:'Frozone',emoji:'🧊'},
  {name:'jack_skellington',display:'Jack Skellington',emoji:'💀'},
  {name:'belle',display:'Belle',emoji:'🌹'},
  {name:'goofy',display:'Goofy',emoji:'🐶'},
];

// State
let currentSkeleton = null, currentState = null, skeletonData = null;
let currentAtlas = null, sceneRenderer = null, lastTime = 0;
let playing = true, speedMul = 1.0;
let canvas, gl, animFrame = null;
let currentChar = null;
let currentGLTexture = null;

// Build character list
const charList = document.getElementById('charList');
CHARACTERS.forEach(c => {
  const li = document.createElement('li');
  li.className = 'char-item';
  li.innerHTML = `<span class="char-thumb">${c.emoji}</span> ${c.display}`;
  li.onclick = () => loadCharacter(c, li);
  charList.appendChild(li);
});

// Controls
const animSelect = document.getElementById('animSelect');
const skinSelect = document.getElementById('skinSelect');
const playBtn = document.getElementById('playBtn');
const speedSlider = document.getElementById('speedSlider');
const resetBtn = document.getElementById('resetBtn');
const infoBar = document.getElementById('infoBar');
const loadingEl = document.getElementById('loading');

canvas = document.getElementById('canvas');

speedSlider.oninput = () => {
  speedMul = parseFloat(speedSlider.value);
  document.getElementById('speedVal').textContent = speedMul.toFixed(1) + '×';
};
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
};
animSelect.onchange = () => {
  if (currentState && animSelect.value) {
    currentState.setAnimation(0, animSelect.value, true);
  }
};
resetBtn.onclick = () => {
  if (currentSkeleton && currentState) {
    const animName = animSelect.value;
    currentState.setAnimation(0, animName, true);
  }
};

// Initialize WebGL renderer
function initRenderer() {
  const glConfig = { alpha: true, premultipliedAlpha: false };
  sceneRenderer = new spine.webgl.SceneRenderer(canvas, canvas.getContext('webgl', glConfig) || canvas.getContext('experimental-webgl', glConfig));
}
initRenderer();

async function loadCharacter(char, li) {
  document.querySelectorAll('.char-item').forEach(el => el.classList.remove('active'));
  li.classList.add('active');
  
  loadingEl.style.display = 'block';
  loadingEl.textContent = `Loading ${char.display}...`;
  infoBar.textContent = `Loading ${char.display}...`;
  animSelect.disabled = true;
  skinSelect.disabled = true;
  playBtn.disabled = true;
  resetBtn.disabled = true;
  
  if (animFrame) cancelAnimationFrame(animFrame);
  currentSkeleton = null;
  currentState = null;
  
  currentChar = char;
  const basePath = `characters/${char.name}/`;
  
  try {
    // Load atlas text
    const atlasRes = await fetch(basePath + 'atlas.atlas?v=9');
    const atlasText = await atlasRes.text();
    
    // Load JSON skeleton
    const jsonRes = await fetch(basePath + 'skeleton.json?v=9');
    const jsonText = await jsonRes.text();
    
    // Load texture image
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = basePath + 'texture.png?v=9';
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });
    
    // Create WebGL texture
    if (currentGLTexture) currentGLTexture.dispose();
    currentGLTexture = new spine.webgl.GLTexture(sceneRenderer.context, img, false);
    
    // Create texture atlas
    currentAtlas = new spine.TextureAtlas(atlasText, function(path) {
      return currentGLTexture;
    });
    
    // Create attachment loader
    const attachmentLoader = new spine.AtlasAttachmentLoader(currentAtlas);
    
    // Parse skeleton JSON
    const json = new spine.SkeletonJson(attachmentLoader);
    skeletonData = json.readSkeletonData(JSON.parse(jsonText));
    
    // Create skeleton
    currentSkeleton = new spine.Skeleton(skeletonData);
    
    // Auto-select best skin (prefer 'default', but pick the one with most attachments)
    skinSelect.innerHTML = '';
    const skinNames = skeletonData.skins.map(s => s.name);
    if (skinNames.length > 0) {
      skinNames.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        skinSelect.appendChild(opt);
      });
      let bestSkin = skinNames[0], bestCount = 0;
      for (const sn of skinNames) {
        const skin = skeletonData.findSkin(sn);
        let count = 0;
        if (skin) {
          for (let i = 0; i < skeletonData.slots.length; i++) {
            if (skin.getAttachment(i, skeletonData.slots[i].attachmentName) != null) count++;
          }
        }
        if (count > bestCount) { bestCount = count; bestSkin = sn; }
      }
      currentSkeleton.setSkinByName(bestSkin);
      currentSkeleton.setSlotsToSetupPose();
      skinSelect.value = bestSkin;
      skinSelect.disabled = false;
    } else {
      skinSelect.disabled = true;
    }
    skinSelect.onchange = () => {
      if (currentSkeleton && skinSelect.value) {
        currentSkeleton.setSkinByName(skinSelect.value);
        currentSkeleton.setSlotsToSetupPose();
      }
    };
    
    // Set up animation
    const stateData = new spine.AnimationStateData(skeletonData);
    currentState = new spine.AnimationState(stateData);
    
    // Populate animation dropdown
    animSelect.innerHTML = '';
    const animNames = skeletonData.animations.map(a => a.name).sort();
    animNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      animSelect.appendChild(opt);
    });
    
    // Set default animation (prefer 'idle')
    const defaultAnim = animNames.includes('idle') ? 'idle' : animNames[0];
    currentState.setAnimation(0, defaultAnim, true);
    animSelect.value = defaultAnim;
    
    // Apply first frame
    currentState.update(0.1);
    currentState.apply(currentSkeleton);
    currentSkeleton.updateWorldTransform();
    
    // Set up camera to frame the skeleton
    const skelW = skeletonData.width || 500;
    const skelH = skeletonData.height || 800;
    sceneRenderer.camera.position.x = skelW / 2;
    sceneRenderer.camera.position.y = skelH / 2;
    // Set viewport to skeleton dimensions, then fit to canvas aspect ratio
    sceneRenderer.camera.setViewport(skelW * 1.1, skelH * 1.1);
    sceneRenderer.camera.update();
    // Now fit the viewport to the canvas aspect ratio
    resizeAndFit();
    
    // Enable controls
    animSelect.disabled = false;
    playBtn.disabled = false;
    resetBtn.disabled = false;
    loadingEl.style.display = 'none';
    
    infoBar.textContent = `${char.display} — ${skeletonData.bones.length} bones, ${skeletonData.slots.length} slots, ${animNames.length} animations — WebGL`;
    
    // Start render loop
    lastTime = performance.now();
    renderLoop();
    
  } catch (err) {
    loadingEl.textContent = `Error: ${err.message}`;
    infoBar.textContent = `Error loading ${char.display}: ${err.message}`;
    console.error(err);
  }
}

function renderLoop() {
  animFrame = requestAnimationFrame(renderLoop);
  
  const now = performance.now();
  let delta = (now - lastTime) / 1000;
  lastTime = now;
  if (delta > 0.1) delta = 0.1;
  
  if (playing && currentState && currentSkeleton) {
    currentState.update(delta * speedMul);
    currentState.apply(currentSkeleton);
    currentSkeleton.updateWorldTransform();
  }
  
  // Clear canvas
  const gl = sceneRenderer.context.gl;
  gl.clearColor(0.102, 0.102, 0.180, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  
  if (currentSkeleton) {
    sceneRenderer.begin();
    sceneRenderer.drawSkeleton(currentSkeleton, false);
    sceneRenderer.end();
  }
}

// Resize canvas to fit window and adjust camera
function resizeAndFit() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (canvas.width != w || canvas.height != h) {
    canvas.width = w;
    canvas.height = h;
  }
  if (sceneRenderer) {
    sceneRenderer.context.gl.viewport(0, 0, canvas.width, canvas.height);
    // Adjust camera viewport to maintain skeleton aspect ratio
    if (skeletonData) {
      const skelW = skeletonData.width || 500;
      const skelH = skeletonData.height || 800;
      const targetW = skelW * 1.1;
      const targetH = skelH * 1.1;
      const targetRatio = targetH / targetW;
      const sourceRatio = h / w;
      let scale, vpW, vpH;
      if (targetRatio < sourceRatio) {
        scale = targetW / w;
        vpW = targetW;
        vpH = h * scale;
      } else {
        scale = targetH / h;
        vpW = w * scale;
        vpH = targetH;
      }
      sceneRenderer.camera.setViewport(vpW, vpH);
      sceneRenderer.camera.update();
    }
  }
}
window.addEventListener('resize', resizeAndFit);
resizeAndFit();
</script>
</body>
</html>

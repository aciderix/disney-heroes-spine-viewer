<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney Heroes — Spine Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
.app { display: flex; height: 100vh; }
.sidebar { width: 220px; background: #16213e; overflow-y: auto; border-right: 1px solid #0f3460; flex-shrink: 0; }
.sidebar h1 { font-size: 14px; padding: 16px; color: #e94560; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.char-list { list-style: none; }
.char-item { padding: 10px 16px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.char-item:hover { background: #0f3460; }
.char-item.active { background: #e94560; color: #fff; }
.char-thumb { width: 32px; height: 32px; border-radius: 6px; background: #0f3460; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.viewer-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #1a1a2e; min-height: 0; }
#canvas { width: 100%; height: 100%; display: block; background: transparent; }
.loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #555; font-size: 14px; z-index: 10; }
.info-bar { background: #0d1b2a; padding: 4px 10px; font-size: 11px; color: #6a7a8a; display: flex; gap: 20px; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.info-bar::-webkit-scrollbar { display: none; }
.gif-status { color: #e94560; font-size: 12px; }
#canvas { cursor: grab; }

/* Export panel */
.export-panel {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 102;
  background: #16213e; border-top: 2px solid #0f3460;
  padding: 16px 16px 24px; border-radius: 12px 12px 0 0;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
  max-height: 80vh; overflow-y: auto;
}
.export-panel.open { display: block; }
.export-panel::before {
  content: ''; display: block; width: 40px; height: 4px;
  background: #0f3460; border-radius: 2px; margin: 0 auto 12px;
}
.export-panel h3 { font-size: 14px; color: #e94560; font-weight: 700; margin-bottom: 12px; text-align: center; letter-spacing: 0.5px; }
.export-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
.export-row label { font-size: 12px; color: #8899aa; min-width: 70px; text-align: right; }
.export-row select, .export-row input {
  background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a7a; border-radius: 8px;
  padding: 7px 10px; font-size: 13px; cursor: pointer;
}
.export-row select { min-width: 120px; }
.export-presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
.preset-btn {
  background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a7a; border-radius: 8px;
  padding: 8px 14px; font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.preset-btn:hover { background: #1a4a7a; }
.preset-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.export-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.export-actions button {
  background: #e94560; color: #fff; border: none; border-radius: 8px;
  padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
.export-actions button:hover { background: #ff5a6e; }
.export-actions button.secondary { background: #0f3460; color: #e0e0e0; }
.export-actions button.secondary:hover { background: #1a4a7a; }
.export-actions button:disabled { opacity: 0.4; cursor: default; }
.export-info { font-size: 11px; color: #6a7a8a; text-align: center; margin-top: 8px; }
.gif-progress-bar { width: 100%; height: 6px; background: #0f3460; border-radius: 3px; margin-top: 10px; display: none; overflow: hidden; }
.gif-progress-bar.show { display: block; }
.gif-progress-fill { height: 100%; background: #e94560; border-radius: 3px; transition: width 0.2s; width: 0%; }


/* Controls drawer (slide-up from bottom) */
.controls-toggle {
  position: fixed; bottom: 12px; right: 12px; z-index: 100;
  background: #16213e; border: 1px solid #0f3460; color: #e0e0e0;
  border-radius: 50%; width: 44px; height: 44px;
  font-size: 20px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  transition: transform 0.2s, background 0.2s;
}
.controls-toggle:hover { background: #1a4a7a; }
.controls-toggle:active { transform: scale(0.9); }
.controls-toggle.active { background: #e94560; }

.controls-drawer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 101;
  background: #16213e; border-top: 2px solid #0f3460;
  transform: translateY(100%); transition: transform 0.3s ease;
  padding: 14px 16px 20px; border-radius: 12px 12px 0 0;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
}
.controls-drawer.open { transform: translateY(0); }
.controls-drawer::before {
  content: ''; display: block; width: 40px; height: 4px;
  background: #0f3460; border-radius: 2px; margin: 0 auto 12px;
}
.controls-content { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.controls-content select, .controls-content button, .controls-content input {
  background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a7a; border-radius: 8px;
  padding: 8px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.controls-content button:hover { background: #1a4a7a; }
.controls-content button:disabled { opacity: 0.4; cursor: default; }
.controls-content label { font-size: 12px; color: #8899aa; white-space: nowrap; }
.controls-content input[type="range"] { width: 80px; padding: 0; }
.controls-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
}
.controls-backdrop.open { display: block; }

.hidden { display: none; }
.mobile-toggle { display: none; position: fixed; top: 8px; left: 8px; z-index: 100; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 6px; padding: 8px 12px; font-size: 18px; cursor: pointer; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }

/* Fullscreen mode */
.app.fullscreen .sidebar { display: none; }
.app.fullscreen .info-bar { display: none; }
.app.fullscreen .main { width: 100vw; }
.app.fullscreen .mobile-toggle { display: none; }
.fullscreen-toggle {
  position: fixed; bottom: 64px; right: 12px; z-index: 100;
  background: #16213e; border: 1px solid #0f3460; color: #e0e0e0;
  border-radius: 50%; width: 44px; height: 44px;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  transition: transform 0.2s, background 0.2s;
}
.fullscreen-toggle:hover { background: #1a4a7a; }
.fullscreen-toggle:active { transform: scale(0.9); }
.fullscreen-toggle.active { background: #e94560; }

@media (max-width: 768px) {
  .mobile-toggle { display: block; }
  .sidebar { position: fixed; left: 0; top: 0; height: 100vh; z-index: 50; transform: translateX(-100%); transition: transform 0.25s ease; width: 75%; max-width: 260px; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop.open { display: block; }
  .info-bar { font-size: 9px; padding: 3px 6px; }
  .controls-toggle { bottom: 12px; right: 12px; width: 48px; height: 48px; font-size: 22px; }
  .controls-content select, .controls-content button { padding: 7px 10px; font-size: 12px; }
  .controls-content input[type="range"] { width: 70px; }
  .fullscreen-toggle { bottom: 68px; right: 12px; width: 48px; height: 48px; font-size: 20px; }
}
</style>
</head>
<body>
<button class="mobile-toggle" id="mobileToggle">☰</button>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <h1>🎭 Disney Heroes</h1>
    <ul class="char-list" id="charList"></ul>
  </aside>
  <main class="main">
    <div class="info-bar" id="infoBar">Select a character</div>
    <div class="viewer-wrap">
      <canvas id="canvas"></canvas>
      <div class="loading" id="loading">Select a character to begin</div>
    </div>
  </main>
</div>

<button class="fullscreen-toggle" id="fullscreenToggle" title="Plein écran">⛶</button>
<button class="controls-toggle" id="controlsToggle">⚙</button>
<div class="controls-backdrop" id="controlsBackdrop"></div>
<div class="controls-drawer" id="controlsDrawer">
  <div class="controls-content">
    <select id="skinSelect" disabled><option>Skin</option></select>
    <select id="animSelect" disabled><option>Animations</option></select>
    <button id="playBtn" disabled>⏸</button>
    <label>⚡</label>
    <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    <span id="speedVal" style="font-size:12px;width:30px">1.0×</span>
    <button id="resetBtn" disabled>🔄</button>
    <button id="gifBtn" disabled>GIF</button>
    <button id="exportBtn" disabled>📥 Export</button>
    <span class="gif-status" id="gifStatus"></span>
  </div>
</div>

<!-- Export panel -->
<div class="export-panel" id="exportPanel">
  <h3>Export Animation</h3>
  <div class="export-presets">
    <button class="preset-btn active" data-preset="auto">Auto</button>
    <button class="preset-btn" data-preset="low">Low</button>
    <button class="preset-btn" data-preset="medium">Medium</button>
    <button class="preset-btn" data-preset="high">High</button>
    <button class="preset-btn" data-preset="ultra">Ultra</button>
  </div>
  <div class="export-row">
    <label>Format</label>
    <select id="exportFormat">
      <option value="gif-fast">GIF (Fast)</option>
      <option value="gif-hq">GIF (High Quality)</option>
      <option value="webm">WebM (Video)</option>
    </select>
  </div>
  <div class="export-row">
    <label>Resolution</label>
    <select id="exportResolution">
      <option value="0">Auto</option>
      <option value="384">384px</option>
      <option value="480">480px</option>
      <option value="720">720px</option>
      <option value="1080">1080px</option>
    </select>
  </div>
  <div class="export-row">
    <label>FPS</label>
    <select id="exportFps">
      <option value="12">12</option>
      <option value="15">15</option>
      <option value="20">20</option>
      <option value="24">24</option>
    </select>
  </div>
  <div class="export-row">
    <label>Duration</label>
    <select id="exportDuration">
      <option value="2">2s</option>
      <option value="3">3s</option>
      <option value="5">5s</option>
      <option value="loop">Full loop</option>
    </select>
  </div>
  <div class="export-actions">
    <button id="exportStartBtn">Export</button>
    <button class="secondary" id="exportCancelBtn">Cancel</button>
  </div>
  <div class="gif-progress-bar" id="exportProgressBar"><div class="gif-progress-fill" id="exportProgressFill"></div></div>
  <div class="export-info" id="exportInfo"></div>
</div>

<script src="spine-webgl.js?v=14"></script>

// State
let currentSkeleton = null, currentState = null, skeletonData = null;
let currentAtlas = null, sceneRenderer = null, lastTime = 0;
let playing = true, speedMul = 1.0;

// Build character list

  const li = document.createElement('li');

  sidebarBackdrop.classList.toggle('open');

};

    currentState.setAnimation(0, animSelect.value, true);
    currentState.update(0.1);
    currentState.apply(currentSkeleton);
    currentSkeleton.updateWorldTransform();
    preSampleAnimation(animSelect.value);
    resizeAndFit();
    scheduleRefit();
  }
};
resetBtn.onclick = () => {
  if (currentSkeleton && currentState) {
    const animName = animSelect.value;
    currentState.setAnimation(0, animName, true);
    currentState.update(0.1);
    currentState.apply(currentSkeleton);
    currentSkeleton.updateWorldTransform();
    preSampleAnimation(animName);
    resizeAndFit();
    scheduleRefit();
  }
};

// Initialize WebGL renderer
function initRenderer() {
  const glConfig = { alpha: true, premultipliedAlpha: false };
  sceneRenderer = new spine.webgl.SceneRenderer(canvas, canvas.getContext('webgl', glConfig) || canvas.getContext('experimental-webgl', glConfig), false);
}
initRenderer();

async function loadCharacter(char, li) {
  document.querySelectorAll('.char-item').forEach(el => el.classList.remove('active'));
  li.classList.add('active');
  // Close sidebar on mobile after selecting
  sidebarEl.classList.remove('open');
  sidebarBackdrop.classList.remove('open');
  
  loadingEl.style.display = 'block';
  loadingEl.textContent = `Loading ${char.display}...`;
  infoBar.textContent = `Loading ${char.display}...`;
  animSelect.disabled = true;
  skinSelect.disabled = true;
  playBtn.disabled = true;
  resetBtn.disabled = true;
  gifBtn.disabled = true;
  exportBtn.disabled = true;
  
  if (animFrame) cancelAnimationFrame(animFrame);
  currentSkeleton = null;
  currentState = null;
  
  currentChar = char;
  const basePath = `characters/${char.name}/`;
  
  try {
    // Load atlas text
    const atlasRes = await fetch(basePath + 'atlas.atlas?v=21');
    let atlasText = await atlasRes.text();
    // Fix atlas: remove broken 'texture.png' first line, then replace .etc1 page names
    {
      const lines = atlasText.split('\n');
      if (lines.length > 0 && lines[0].trim() === 'texture.png') lines.shift();
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim().endsWith('.etc1')) lines[i] = 'texture.png';
      }
      atlasText = lines.join('\n');
    }
    
    // Load JSON skeleton
    const jsonRes = await fetch(basePath + 'skeleton.json?v=21');
    const jsonText = await jsonRes.text();
    
    // Load texture image
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = basePath + 'texture.png?v=21';
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });
    
    // Premultiply alpha to fix seam artifacts at mesh boundaries
    const pmaCanvas = document.createElement('canvas');
    pmaCanvas.width = img.width;
    pmaCanvas.height = img.height;
    const pmaCtx = pmaCanvas.getContext('2d');
    pmaCtx.drawImage(img, 0, 0);
    const pmaData = pmaCtx.getImageData(0, 0, img.width, img.height);
    const px = pmaData.data;
    for (let i = 0; i < px.length; i += 4) {
      px[i] = Math.round(px[i] * px[i+3] / 255);
      px[i+1] = Math.round(px[i+1] * px[i+3] / 255);
      px[i+2] = Math.round(px[i+2] * px[i+3] / 255);
    }
    pmaCtx.putImageData(pmaData, 0, 0);
    
    // Create WebGL texture from premultiplied canvas
    if (currentGLTexture) currentGLTexture.dispose();
    currentGLTexture = new spine.webgl.GLTexture(sceneRenderer.context, pmaCanvas, false);
    
    // Create texture atlas
    currentAtlas = new spine.TextureAtlas(atlasText, function(path) {
      return currentGLTexture;
    });
    
    // Create attachment loader
    const attachmentLoader = new spine.AtlasAttachmentLoader(currentAtlas);
    
    // Parse skeleton JSON
    const json = new spine.SkeletonJson(attachmentLoader);
    skeletonData = json.readSkeletonData(JSON.parse(jsonText));
    
    // Create skeleton
    currentSkeleton = new spine.Skeleton(skeletonData);
    
    // Auto-select best skin (prefer 'default', but pick the one with most attachments)
    skinSelect.innerHTML = '';
    const skinNames = skeletonData.skins.map(s => s.name);
    if (skinNames.length > 0) {
      skinNames.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        skinSelect.appendChild(opt);
      });
      let bestSkin = skinNames[0], bestCount = 0;
      for (const sn of skinNames) {
        const skin = skeletonData.findSkin(sn);
        let count = 0;
        if (skin) {
          for (let i = 0; i < skeletonData.slots.length; i++) {
            if (skin.getAttachment(i, skeletonData.slots[i].attachmentName) != null) count++;
          }
        }
        if (count > bestCount) { bestCount = count; bestSkin = sn; }
      }
      currentSkeleton.setSkinByName(bestSkin);
      currentSkeleton.setSlotsToSetupPose();
      skinSelect.value = bestSkin;
      skinSelect.disabled = false;
    } else {
      skinSelect.disabled = true;
    }
    skinSelect.onchange = () => {
      if (currentSkeleton && skinSelect.value) {
        currentSkeleton.setSkinByName(skinSelect.value);
        currentSkeleton.setSlotsToSetupPose();
        if (currentState) {
          currentState.apply(currentSkeleton);
          currentSkeleton.updateWorldTransform();
        }
        resetManualView();
        preSampleAnimation(animSelect.value);
        resizeAndFit();
        scheduleRefit();
      }
    };
    
    // Set up animation
    const stateData = new spine.AnimationStateData(skeletonData);
    stateData.defaultMix = 0.15;
    currentState = new spine.AnimationState(stateData);
    
    // Populate animation dropdown
    animSelect.innerHTML = '';
    const animNames = skeletonData.animations.map(a => a.name).sort();
    animNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      animSelect.appendChild(opt);
    });
    
    // Set default animation (prefer 'idle')
    const defaultAnim = animNames.includes('idle') ? 'idle' : animNames[0];
    currentState.setAnimation(0, defaultAnim, true);
    animSelect.value = defaultAnim;
    
    // Apply first frame
    currentState.update(0.1);
    currentState.apply(currentSkeleton);
    currentSkeleton.updateWorldTransform();
    
    // Pre-sample the animation to find max bounds, then fit viewport
    resetManualView();
    preSampleAnimation(defaultAnim);
    resizeAndFit();
    scheduleRefit();
    
    // Enable controls
    animSelect.disabled = false;
    playBtn.disabled = false;
    resetBtn.disabled = false;
    gifBtn.disabled = false;
    exportBtn.disabled = false;
    loadingEl.style.display = 'none';
    
    infoBar.textContent = `${char.display} — ${skeletonData.bones.length} bones, ${skeletonData.slots.length} slots, ${animNames.length} animations — WebGL`;
    
    // Start render loop
    lastTime = performance.now();
    renderLoop();
    
  } catch (err) {
    loadingEl.textContent = `Error: ${err.message}`;
    infoBar.textContent = `Error loading ${char.display}: ${err.message}`;
    console.error(err);
  }
}

// ============================================================
// Export system — configurable GIF/WebM export with optimization
// Phase 1: User-configurable params + adaptive workers
// Phase 2: gifenc for fast mode, gif.js for HQ mode, global palette
// Phase 3: WebM via MediaRecorder, pipelined capture→encode
// ============================================================

// Export state
let gifFrames = [];
let gifRecording = false;
let gifFrameCount = 0;
let exportRecording = false;
let exportCancelled = false;

// Export DOM refs
const exportBtn = document.getElementById('exportBtn');
const exportPanel = document.getElementById('exportPanel');
const exportFormat = document.getElementById('exportFormat');
const exportResolution = document.getElementById('exportResolution');
const exportFps = document.getElementById('exportFps');
const exportDuration = document.getElementById('exportDuration');
const exportStartBtn = document.getElementById('exportStartBtn');
const exportCancelBtn = document.getElementById('exportCancelBtn');
const exportProgressBar = document.getElementById('exportProgressBar');
const exportProgressFill = document.getElementById('exportProgressFill');
const exportInfo = document.getElementById('exportInfo');
const gifStatus = document.getElementById('gifStatus');

// Preset definitions
const EXPORT_PRESETS = {
  auto:    { fps: 0,  res: 0,    duration: 0,       format: null },       // auto-detect
  low:     { fps: 12, res: 384,  duration: 2,        format: 'gif-fast' },
  medium:  { fps: 15, res: 480,  duration: 3,        format: 'gif-fast' },
  high:    { fps: 20, res: 720,  duration: 3,        format: 'gif-hq' },
  ultra:   { fps: 24, res: 1080, duration: 'loop',   format: 'webm' },
};
let currentPreset = 'auto';

// Apply a preset to the form controls
function applyPreset(name) {
  currentPreset = name;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === name);
  });
  const p = EXPORT_PRESETS[name];
  if (!p) return;

  // For 'auto', let the controls stay at their defaults (auto-detection at export time)
  if (name !== 'auto') {
    exportFormat.value = p.format || 'gif-fast';
    exportResolution.value = String(p.res);
    exportFps.value = String(p.fps);
    exportDuration.value = String(p.duration);
  }
}

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.onclick = () => applyPreset(btn.dataset.preset);
});

// Open/close export panel
exportBtn.onclick = () => {
  exportPanel.classList.toggle('open');
};
exportCancelBtn.onclick = () => {
  exportPanel.classList.remove('open');
  if (exportRecording) { exportCancelled = true; }
};

// Auto-detect best settings based on device
function autoDetectSettings() {
  const devMem = navigator.deviceMemory || 4;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  let fps, res, duration, format;
  if (isMobile && devMem < 4) {
    fps = 12; res = 384; duration = 2; format = 'gif-fast';
  } else if (isMobile) {
    fps = 15; res = 480; duration = 3; format = 'gif-fast';
  } else {
    fps = 20; res = 720; duration = 3; format = 'gif-hq';
  }
  return { fps, res, duration, format };
}

// Resolve actual export parameters from UI + preset
function resolveExportParams() {
  let fps, res, duration, format;

  if (currentPreset === 'auto') {
    const auto = autoDetectSettings();
    fps = auto.fps; res = auto.res; duration = auto.duration; format = auto.format;
  } else {
    fps = parseInt(exportFps.value);
    res = parseInt(exportResolution.value);
    format = exportFormat.value;
    const durVal = exportDuration.value;
    duration = (durVal === 'loop') ? 'loop' : parseInt(durVal);
  }

  // If resolution is 0 (auto), use canvas width
  if (res === 0 || res === '0') {
    const devMem = navigator.deviceMemory || 4;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    res = isMobile ? (devMem < 4 ? 384 : 480) : 720;
  }

  return { fps, res, duration, format };
}

// Calculate the number of frames for a given duration
function getDurationSeconds(duration, fps) {
  if (duration === 'loop') {
    // Get the current animation duration
    if (currentState && currentState.tracks[0]) {
      const anim = currentState.tracks[0].animation;
      if (anim && anim.duration > 0) {
        // Round to nearest frame
        return Math.max(Math.ceil(anim.duration * fps) / fps, 1);
      }
    }
    return 3; // fallback
  }
  return duration;
}

// Show/hide progress bar
function showProgress(show) {
  exportProgressBar.classList.toggle('show', show);
  if (show) exportProgressFill.style.width = '0%';
}
function setProgress(pct) {
  exportProgressFill.style.width = pct + '%';
}

// ============================================================
// gifenc loader (lazy, cached)
// ============================================================
let _gifencModule = null;
async function loadGifenc() {
  if (_gifencModule) return _gifencModule;
  const mod = await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js');
  _gifencModule = mod;
  return mod;
}

// ============================================================
// gif.js loader (lazy, cached) — for HQ mode with dithering
// ============================================================
let _gifWorkerBlobUrl = null;
async function getGifWorkerBlobUrl() {
  if (_gifWorkerBlobUrl) return _gifWorkerBlobUrl;
  try {
    const res = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
    const text = await res.text();
    const blob = new Blob([text], { type: 'application/javascript' });
    _gifWorkerBlobUrl = URL.createObjectURL(blob);
    return _gifWorkerBlobUrl;
  } catch (e) {
    return 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js';
  }
}

async function loadGifJs() {
  if (typeof GIF !== 'undefined') return;
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js';
  await new Promise((res, rej) => { script.onload = res; script.onerror = rej; document.head.appendChild(script); });
}

// ============================================================
// Optimized worker count
// ============================================================
function getOptimalWorkers() {
  // gif.js supports parallel frame encoding; use all available cores (cap at 8)
  return Math.min(8, navigator.hardwareConcurrency || 4);
}

// ============================================================
// Export via gifenc (fast mode — no dithering, global palette)
// ============================================================
async function exportGifEnc(gifW, gifH, fps, durationSec) {
  const { GIFEncoder, quantize, applyPalette } = await loadGifenc();
  const maxFrames = Math.ceil(fps * durationSec);
  const delay = Math.round(1000 / fps);

  exportInfo.textContent = 'Loading gifenc...';
  showProgress(true);

  // Create the encoder stream
  const gif = GIFEncoder();
  let globalPalette = null;
  let firstFrame = true;

  // Capture frames
  const gifInterval = 1000 / fps;
  let gifLastTime = performance.now();
  let gifAccum = 0;
  gifFrames = [];
  gifFrameCount = 0;
  exportRecording = true;
  exportCancelled = false;

  const capturePromise = new Promise((resolve) => {
    const gifLoop = () => {
      if (!exportRecording) { resolve(); return; }
      if (exportCancelled) { exportRecording = false; resolve(); return; }
      const now = performance.now();
      const dt = now - gifLastTime;
      gifLastTime = now;
      gifAccum += dt;

      if (gifAccum >= gifInterval) {
        gifAccum = 0;
        const tmpC = document.createElement('canvas');
        tmpC.width = gifW;
        tmpC.height = gifH;
        tmpC.getContext('2d').drawImage(canvas, 0, 0, gifW, gifH);
        gifFrames.push(tmpC);
        gifFrameCount++;
        const pct = Math.round((gifFrameCount / maxFrames) * 50); // capture = 50% of progress
        setProgress(pct);
        gifStatus.textContent = `Capturing ${gifFrameCount}/${maxFrames}...`;

        if (gifFrameCount >= maxFrames) {
          exportRecording = false;
          resolve();
        }
      }
      if (exportRecording) requestAnimationFrame(gifLoop);
    };
    gifLoop();
  });

  await capturePromise;
  if (exportCancelled) { showProgress(false); gifStatus.textContent = 'Cancelled'; return; }

  // Encode with gifenc — pipeline: encode each frame as we go
  exportInfo.textContent = 'Encoding with gifenc (fast mode)...';

  for (let i = 0; i < gifFrames.length; i++) {
    if (exportCancelled) break;

    const frameCanvas = gifFrames[i];
    const ctx = frameCanvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, gifW, gifH);
    const rgba = imageData.data;

    // For the first frame, compute a global palette to reuse for all frames
    // This is a huge speedup vs per-frame quantization
    let palette;
    if (firstFrame || !globalPalette) {
      palette = quantize(rgba, 256, { format: 'rgb565' });
      globalPalette = palette;
    } else {
      // Optionally re-quantize every N frames for better color accuracy
      // For fast mode, we reuse the global palette (big speedup)
      palette = globalPalette;
    }

    const index = applyPalette(rgba, palette, 'rgb565');

    gif.writeFrame(index, gifW, gifH, {
      palette: firstFrame ? palette : undefined, // first frame sets global palette
      delay: delay,
      repeat: 0, // loop forever
      transparent: false,
    });
    firstFrame = false;

    const pct = 50 + Math.round((i / gifFrames.length) * 50);
    setProgress(pct);
    gifStatus.textContent = `Encoding ${i + 1}/${gifFrames.length}...`;
  }

  gif.finish();
  const bytes = gif.bytes();
  gifFrames = [];

  if (exportCancelled) { showProgress(false); gifStatus.textContent = 'Cancelled'; return; }

  // Download
  const blob = new Blob([bytes], { type: 'image/gif' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentChar ? currentChar.name : 'character'}.gif`;
  a.click();
  URL.revokeObjectURL(url);

  setProgress(100);
  gifStatus.textContent = 'Done! (fast mode)';
  exportInfo.textContent = '';
  showProgress(false);
  setTimeout(() => { gifStatus.textContent = ''; }, 3000);
}

// ============================================================
// Export via gif.js (HQ mode — dithering, multi-worker)
// ============================================================
async function exportGifJs(gifW, gifH, fps, durationSec) {
  const maxFrames = Math.ceil(fps * durationSec);
  const delay = Math.round(1000 / fps);
  const workers = getOptimalWorkers();
  const quality = 5; // high quality (lower = better in gif.js)

  exportInfo.textContent = 'Loading gif.js...';
  showProgress(true);

  await loadGifJs();
  const workerBlobUrl = await getGifWorkerBlobUrl();

  // Capture frames
  const gifInterval = 1000 / fps;
  let gifLastTime = performance.now();
  let gifAccum = 0;
  gifFrames = [];
  gifFrameCount = 0;
  exportRecording = true;
  exportCancelled = false;

  const capturePromise = new Promise((resolve) => {
    const gifLoop = () => {
      if (!exportRecording) { resolve(); return; }
      if (exportCancelled) { exportRecording = false; resolve(); return; }
      const now = performance.now();
      const dt = now - gifLastTime;
      gifLastTime = now;
      gifAccum += dt;

      if (gifAccum >= gifInterval) {
        gifAccum = 0;
        const tmpC = document.createElement('canvas');
        tmpC.width = gifW;
        tmpC.height = gifH;
        tmpC.getContext('2d').drawImage(canvas, 0, 0, gifW, gifH);
        gifFrames.push(tmpC);
        gifFrameCount++;
        const pct = Math.round((gifFrameCount / maxFrames) * 60);
        setProgress(pct);
        gifStatus.textContent = `Capturing ${gifFrameCount}/${maxFrames}...`;

        if (gifFrameCount >= maxFrames) {
          exportRecording = false;
          resolve();
        }
      }
      if (exportRecording) requestAnimationFrame(gifLoop);
    };
    gifLoop();
  });

  await capturePromise;
  if (exportCancelled) { showProgress(false); gifStatus.textContent = 'Cancelled'; return; }

  // Encode with optimized workers
  exportInfo.textContent = `Encoding with gif.js (${workers} workers, quality ${quality})...`;

  const gif = new GIF({
    workers: workers,
    quality: quality,
    width: gifW,
    height: gifH,
    workerScript: workerBlobUrl,
  });

  for (const frameCanvas of gifFrames) {
    gif.addFrame(frameCanvas, { delay: delay, copy: true });
  }
  gifFrames = [];

  gif.on('progress', (p) => {
    setProgress(60 + Math.round(p * 40));
    gifStatus.textContent = `Encoding ${Math.round(p * 100)}%...`;
  });

  return new Promise((resolve, reject) => {
    gif.on('finished', (blob) => {
      if (exportCancelled) { showProgress(false); gifStatus.textContent = 'Cancelled'; resolve(); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentChar ? currentChar.name : 'character'}.gif`;
      a.click();
      URL.revokeObjectURL(url);
      setProgress(100);
      gifStatus.textContent = 'Done! (HQ mode)';
      exportInfo.textContent = '';
      showProgress(false);
      setTimeout(() => { gifStatus.textContent = ''; }, 3000);
      resolve();
    });
    gif.on('abort', () => { reject(new Error('Aborted')); });
    gif.render();
  }).catch(e => {
    gifStatus.textContent = 'GIF error: ' + e.message;
    exportInfo.textContent = '';
    showProgress(false);
  });
}

// ============================================================
// Export via WebM (MediaRecorder — near-instant, best quality)
// ============================================================
async function exportWebM(gifW, gifH, fps, durationSec) {
  exportInfo.textContent = 'Recording WebM...';
  showProgress(true);

  // Create an offscreen canvas at the target resolution
  const recordCanvas = document.createElement('canvas');
  recordCanvas.width = gifW;
  recordCanvas.height = gifH;
  const recordCtx = recordCanvas.getContext('2d');

  // Choose the best supported codec
  const mimeTypes = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  let mimeType = null;
  for (const mt of mimeTypes) {
    if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; }
  }
  if (!mimeType) {
    gifStatus.textContent = 'WebM not supported on this browser';
    showProgress(false);
    return;
  }

  const stream = recordCanvas.captureStream(fps);
  const recorder = new MediaRecorder(stream, {
    mimeType: mimeType,
    videoBitsPerSecond: Math.min(8000000, gifW * gifH * fps * 0.1), // ~10 bits per pixel
  });

  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

  const totalMs = durationSec * 1000;
  let elapsed = 0;

  exportRecording = true;
  exportCancelled = false;

  recorder.start();

  // Render frames at target FPS
  const frameInterval = 1000 / fps;
  let lastFrameTime = performance.now();
  let frameNum = 0;
  const totalFrames = Math.ceil(fps * durationSec);

  await new Promise((resolve) => {
    const renderFrame = () => {
      if (!exportRecording || exportCancelled) { resolve(); return; }
      const now = performance.now();
      const dt = now - lastFrameTime;
      lastFrameTime = now;

      // Draw the current canvas content to the recording canvas
      // (mirror + alpha handling)
      recordCtx.clearRect(0, 0, gifW, gifH);
      recordCtx.drawImage(canvas, 0, 0, gifW, gifH);
      frameNum++;

      const pct = Math.round((frameNum / totalFrames) * 90);
      setProgress(pct);
      gifStatus.textContent = `Recording ${frameNum}/${totalFrames}...`;

      if (frameNum >= totalFrames) { resolve(); return; }

      // Schedule next frame
      setTimeout(renderFrame, frameInterval);
    };
    renderFrame();
  });

  // Stop recorder and wait for final data
  await new Promise((resolve) => {
    recorder.onstop = resolve;
    recorder.stop();
  });

  if (exportCancelled) { showProgress(false); gifStatus.textContent = 'Cancelled'; return; }

  // Download
  const blob = new Blob(chunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentChar ? currentChar.name : 'character'}.webm`;
  a.click();
  URL.revokeObjectURL(url);

  setProgress(100);
  gifStatus.textContent = 'Done! (WebM)';
  exportInfo.textContent = '';
  showProgress(false);
  exportRecording = false;
  setTimeout(() => { gifStatus.textContent = ''; }, 3000);
}

// ============================================================
// Main export entry point
// ============================================================
exportStartBtn.onclick = async () => {
  if (exportRecording || gifRecording) return;

  const { fps, res, duration, format } = resolveExportParams();
  const durationSec = getDurationSeconds(duration, fps);

  // Refit before export to ensure character is fully visible
  resetManualView();
  preSampleAnimation(animSelect.value);
  resizeAndFit();
  // Wait a frame for the refit to take effect
  await new Promise(r => requestAnimationFrame(r));

  // Calculate target dimensions
  const scale = Math.min(1, res / canvas.width);
  const gifW = Math.round(canvas.width * scale);
  const gifH = Math.round(canvas.height * scale);

  exportCancelled = false;
  exportStartBtn.disabled = true;

  try {
    if (format === 'webm') {
      await exportWebM(gifW, gifH, fps, durationSec);
    } else if (format === 'gif-fast') {
      await exportGifEnc(gifW, gifH, fps, durationSec);
    } else if (format === 'gif-hq') {
      await exportGifJs(gifW, gifH, fps, durationSec);
    }
  } catch (e) {
    gifStatus.textContent = 'Export error: ' + e.message;
    showProgress(false);
  } finally {
    exportStartBtn.disabled = false;
    exportRecording = false;
  }
};

// ============================================================
// Legacy GIF button — quick export with auto settings (backwards compat)
// ============================================================
gifBtn.onclick = () => {
  if (gifRecording || exportRecording) return;

  // Refit before export
  resetManualView();
  preSampleAnimation(animSelect.value);
  resizeAndFit();

  const auto = autoDetectSettings();
  const durationSec = auto.duration;
  const scale = Math.min(1, auto.res / canvas.width);
  const gifW = Math.round(canvas.width * scale);
  const gifH = Math.round(canvas.height * scale);

  // Use fast mode (gifenc) for the quick button on desktop, gif.js for mobile
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const format = isMobile ? 'gif-fast' : 'gif-hq';

  if (format === 'gif-fast') {
    exportGifEnc(gifW, gifH, auto.fps, durationSec);
  } else {
    exportGifJs(gifW, gifH, auto.fps, durationSec);
  }
};

// Manual zoom/pan state
let manualZoom = 1.0;       // user zoom multiplier (1 = auto-fit)
let manualOffsetX = 0;     // user pan offset (world units)
let manualOffsetY = 0;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragStartOffsetX = 0, dragStartOffsetY = 0;

// Mouse wheel zoom
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  manualZoom *= factor;
  manualZoom = Math.max(0.2, Math.min(5, manualZoom));
  resizeAndFit();
}, { passive: false });

// Mouse drag pan
canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragStartOffsetX = manualOffsetX;
  dragStartOffsetY = manualOffsetY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const dx = (e.clientX - dragStartX) / dpr;
  const dy = (e.clientY - dragStartY) / dpr;
  // Convert screen delta to world units
  const b = getSkeletonBounds();
  const w = canvas.parentElement.clientWidth || window.innerWidth;
  const h = canvas.parentElement.clientHeight || window.innerHeight;
  const targetW = Math.max(b.w * 1.15, 1);
  const targetH = Math.max(b.h * 1.15, 1);
  const scale = Math.min(w / targetW, h / targetH) * manualZoom;
  manualOffsetX = dragStartOffsetX - dx / scale;
  manualOffsetY = dragStartOffsetY + dy / scale;  // Y is flipped
  resizeAndFit();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.style.cursor = '';
});

// Touch pinch zoom + drag pan
let touchDist = 0;
let touchStartDist = 0;
let touchStartZoom = 1;
let touchStartX = 0, touchStartY = 0;
let touchStartOffsetX = 0, touchStartOffsetY = 0;

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.hypot(dx, dy);
    touchStartZoom = manualZoom;
  } else if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartOffsetX = manualOffsetX;
    touchStartOffsetY = manualOffsetY;
    isDragging = true;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchDist = Math.hypot(dx, dy);
    manualZoom = Math.max(0.2, Math.min(5, touchStartZoom * (touchDist / touchStartDist)));
    resizeAndFit();
  } else if (e.touches.length === 1 && isDragging) {
    e.preventDefault();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const dx = (e.touches[0].clientX - touchStartX) / dpr;
    const dy = (e.touches[0].clientY - touchStartY) / dpr;
    const b = getSkeletonBounds();
    const w = canvas.parentElement.clientWidth || window.innerWidth;
    const h = canvas.parentElement.clientHeight || window.innerHeight;
    const targetW = Math.max(b.w * 1.15, 1);
    const targetH = Math.max(b.h * 1.15, 1);
    const scale = Math.min(w / targetW, h / targetH) * manualZoom;
    manualOffsetX = touchStartOffsetX - dx / scale;
    manualOffsetY = touchStartOffsetY + dy / scale;
    resizeAndFit();
  }
}, { passive: false });

canvas.addEventListener('touchend', () => {
  isDragging = false;
});

// Double-click/tap to reset zoom and recenter
canvas.addEventListener('dblclick', () => {
  manualZoom = 1.0;
  manualOffsetX = 0;
  manualOffsetY = 0;
  resizeAndFit();
});

// Reset manual zoom when switching characters or animations
function resetManualView() {
  manualZoom = 1.0;
  manualOffsetX = 0;
  manualOffsetY = 0;
}

function renderLoop() {
  animFrame = requestAnimationFrame(renderLoop);
  
  const now = performance.now();
  let delta = (now - lastTime) / 1000;
  lastTime = now;
  if (delta > 0.1) delta = 0.1;
  
  if (playing && currentState && currentSkeleton) {
    currentState.update(delta * speedMul);
    currentState.apply(currentSkeleton);
    currentSkeleton.updateWorldTransform();
    // Track max bounds across animation frames for auto-fitting
    updateMaxBounds();
    if (_needsRefit) {
      _needsRefit = false;
      resizeAndFit();
    }
  }
  
  // Clear canvas
  const gl = sceneRenderer.context.gl;
  gl.clearColor(0.102, 0.102, 0.180, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  
  if (currentSkeleton) {
    sceneRenderer.begin();
    sceneRenderer.drawSkeleton(currentSkeleton, true);
    sceneRenderer.end();
  }
}

// Resize canvas to fit container and center skeleton
const _boundsOffset = [0, 0];
const _boundsSize = [0, 0];
const _boundsTemp = [];
let _resizeCount = 0;
let _fitTimer = null;

// Track the MAXIMUM bounds seen across all animation frames.
// This lets us fit the viewport to the widest pose the skeleton ever reaches,
// so nothing ever clips — no manual padding tuning needed.
let _maxBounds = null;  // { x, y, w, h } or null
let _needsRefit = false;

function resetMaxBounds() {
  _maxBounds = null;
  _needsRefit = true;
}

// Pre-sample an entire animation to find the maximum bounding box.
// This avoids cropping when the skeleton's pose extends beyond the
// first-frame bounds used for the initial viewport fit.
function preSampleAnimation(animName) {
  if (!skeletonData || !currentSkeleton) return;
  const anim = skeletonData.findAnimation(animName);
  if (!anim) return;

  // Use a temporary skeleton so the live one is not disturbed
  const tempSkel = new spine.Skeleton(skeletonData);
  const skin = currentSkeleton.skin;
  if (skin) tempSkel.setSkin(skin);
  tempSkel.setToSetupPose();

  const tempStateData = new spine.AnimationStateData(skeletonData);
  tempStateData.defaultMix = 0;  // no crossfade during sampling
  const tempState = new spine.AnimationState(tempStateData);
  tempState.setAnimation(0, animName, true);

  const step = 1 / 60;  // sample at 60 fps to catch extreme poses
  const duration = Math.max(anim.duration, 0.1);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const off = [0, 0], sz = [0, 0], tmp = [];

  for (let t = 0; t < duration; t += step) {
    tempState.update(step);
    tempState.apply(tempSkel);
    tempSkel.updateWorldTransform();
    try {
      tempSkel.getBounds(off, sz, tmp);
      if (sz[0] > 0 && sz[1] > 0 && isFinite(off[0]) && isFinite(off[1])) {
        minX = Math.min(minX, off[0]);
        minY = Math.min(minY, off[1]);
        maxX = Math.max(maxX, off[0] + sz[0]);
        maxY = Math.max(maxY, off[1] + sz[1]);
      }
    } catch (e) { /* skip frame */ }
  }

  if (minX < Infinity && minY < Infinity && maxX > -Infinity && maxY > -Infinity) {
    let bw = maxX - minX, bh = maxY - minY;
    // Safety: ensure bounds are at least as large as skeletonData dimensions
    if (skeletonData) {
      const dataW = skeletonData.width || 0;
      const dataH = skeletonData.height || 0;
      if (dataW > bw) {
        const cx = minX + bw / 2;
        bw = dataW;
        minX = cx - bw / 2;
      }
      if (dataH > bh) {
        const cy = minY + bh / 2;
        bh = dataH;
        minY = cy - bh / 2;
      }
    }
    // Add 10% safety margin to the pre-sampled bounds themselves
    const margin = 0.10;
    minX -= bw * margin;
    minY -= bh * margin;
    bw *= (1 + margin * 2);
    bh *= (1 + margin * 2);
    _maxBounds = { x: minX, y: minY, w: bw, h: bh };
  } else {
    _maxBounds = null;
  }
  _needsRefit = true;
}

function updateMaxBounds() {
  if (!currentSkeleton) return;
  try {
    currentSkeleton.getBounds(_boundsOffset, _boundsSize, _boundsTemp);
    if (_boundsSize[0] <= 0 || _boundsSize[1] <= 0 ||
        !isFinite(_boundsOffset[0]) || !isFinite(_boundsOffset[1]) ||
        !isFinite(_boundsSize[0]) || !isFinite(_boundsSize[1])) return;
    const bx = _boundsOffset[0], by = _boundsOffset[1], bw = _boundsSize[0], bh = _boundsSize[1];
    if (!_maxBounds) {
      _maxBounds = { x: bx, y: by, w: bw, h: bh };
      _needsRefit = true;
    } else {
      // Expand the union to include the new bounds
      const minX = Math.min(_maxBounds.x, bx);
      const minY = Math.min(_maxBounds.y, by);
      const maxX = Math.max(_maxBounds.x + _maxBounds.w, bx + bw);
      const maxY = Math.max(_maxBounds.y + _maxBounds.h, by + bh);
      const newW = maxX - minX;
      const newH = maxY - minY;
      // Always refit if bounds grew at all (was 0.5% threshold, too aggressive)
      if (newW > _maxBounds.w || newH > _maxBounds.h) {
        _needsRefit = true;
      }
      _maxBounds.x = minX;
      _maxBounds.y = minY;
      _maxBounds.w = newW;
      _maxBounds.h = newH;
    }
  } catch (e) { /* ignore */ }
}

function getSkeletonBounds() {
  // Priority 1: use accumulated max bounds from animation sampling
  if (_maxBounds && _maxBounds.w > 0 && _maxBounds.h > 0) {
    return { x: _maxBounds.x, y: _maxBounds.y, w: _maxBounds.w, h: _maxBounds.h };
  }

  // Priority 2: try runtime getBounds (current pose)
  let skelX = 0, skelY = 0, skelW = 0, skelH = 0;
  if (currentSkeleton) {
    currentSkeleton.updateWorldTransform();
    try {
      currentSkeleton.getBounds(_boundsOffset, _boundsSize, _boundsTemp);
      if (_boundsSize[0] > 0 && _boundsSize[1] > 0 &&
          isFinite(_boundsOffset[0]) && isFinite(_boundsOffset[1]) &&
          isFinite(_boundsSize[0]) && isFinite(_boundsSize[1])) {
        skelX = _boundsOffset[0];
        skelY = _boundsOffset[1];
        skelW = _boundsSize[0];
        skelH = _boundsSize[1];
      }
    } catch (e) { /* ignore */ }
  }

  // Priority 3: skeletonData dimensions
  if (skeletonData) {
    const dataW = skeletonData.width || 0;
    const dataH = skeletonData.height || 0;
    if (dataW > 0 && dataH > 0) {
      if (skelW <= 0 || skelH <= 0) {
        skelW = dataW;
        skelH = dataH;
        if (skeletonData.x) skelX = skeletonData.x;
        if (skeletonData.y) skelY = skeletonData.y;
      } else {
        skelW = Math.max(skelW, dataW);
        skelH = Math.max(skelH, dataH);
      }
    }
  }

  // Final fallback
  if (skelW <= 0 || skelH <= 0) {
    skelW = 600;
    skelH = 400;
  }

  return { x: skelX, y: skelY, w: skelW, h: skelH };
}

function resizeAndFit() {
  const wrap = canvas.parentElement;

  // Reset canvas size first so it doesn't block the parent's flex recalc
  // (important on mobile orientation changes)
  canvas.style.width = '0px';
  canvas.style.height = '0px';

  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || window.innerHeight;
  if (w <= 0 || h <= 0) return;

  // High-DPI / Retina support — canvas uses physical pixels
  const dpr = Math.min(window.devicePixelRatio || 1, 3); // cap at 3x for perf
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  if (sceneRenderer) {
    sceneRenderer.context.gl.viewport(0, 0, canvas.width, canvas.height);

    const b = getSkeletonBounds();
    let skelX = b.x, skelY = b.y, skelW = b.w, skelH = b.h;

    // Padding — max bounds already has safety margin, but add extra
    // breathing room (15%) to ensure nothing is clipped on any screen format.
    const pad = 1.15;
    const targetW = Math.max(skelW * pad, 1);
    const targetH = Math.max(skelH * pad, 1);

    // Standard 'contain': scale so skeleton fits entirely within canvas
    const scale = Math.min(w / targetW, h / targetH);
    const vpW = w / scale;
    const vpH = h / scale;

    // Apply manual zoom (user zoom multiplier)
    const finalVpW = vpW / manualZoom;
    const finalVpH = vpH / manualZoom;
    sceneRenderer.camera.setViewport(finalVpW, finalVpH);
    sceneRenderer.camera.position.x = skelX + skelW / 2 + manualOffsetX;
    sceneRenderer.camera.position.y = skelY + skelH / 2 + manualOffsetY;
    sceneRenderer.camera.update();
  }
}

// Periodically refit during animation — skeleton bounds can change
// as the first animation frames are applied
function scheduleRefit() {
  if (_fitTimer) clearTimeout(_fitTimer);
  _resizeCount = 0;
  const refit = () => {
    resizeAndFit();
    _resizeCount++;
    if (_resizeCount < 20) {
      _fitTimer = setTimeout(refit, 100 * (_resizeCount + 1));
    }
  };
  refit();
}
window.addEventListener('resize', resizeAndFit);
// Also observe canvas container for size changes (e.g. controls wrapping)
if (typeof ResizeObserver !== 'undefined') {
  const ro = new ResizeObserver(() => resizeAndFit());
  ro.observe(canvas.parentElement);
}
resizeAndFit();

// Fullscreen toggle — hides sidebar, uses browser Fullscreen API
const fullscreenToggle = document.getElementById('fullscreenToggle');
const appEl = document.querySelector('.app');
let isFullscreen = false;
function enterFullscreen() {
  isFullscreen = true;
  appEl.classList.add('fullscreen');
  fullscreenToggle.classList.add('active');
  fullscreenToggle.textContent = '⛶';
  // Close sidebar if open on mobile
  sidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('open');
  // Try browser Fullscreen API for true fullscreen
  const elem = document.documentElement;
  if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
  else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
  setTimeout(resizeAndFit, 100);
  setTimeout(resizeAndFit, 320);
}
function exitFullscreen() {
  isFullscreen = false;
  appEl.classList.remove('fullscreen');
  fullscreenToggle.classList.remove('active');
  fullscreenToggle.textContent = '⛶';
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  setTimeout(resizeAndFit, 100);
  setTimeout(resizeAndFit, 320);
}
fullscreenToggle.onclick = () => {
  if (isFullscreen) exitFullscreen();
  else enterFullscreen();
};
// Also exit fullscreen on Esc (browser handles this, but we need to sync state)
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && isFullscreen) {
    isFullscreen = false;
    appEl.classList.remove('fullscreen');
    fullscreenToggle.classList.remove('active');
    setTimeout(resizeAndFit, 100);
  }
});
document.addEventListener('webkitfullscreenchange', () => {
  if (!document.webkitFullscreenElement && isFullscreen) {
    isFullscreen = false;
    appEl.classList.remove('fullscreen');
    fullscreenToggle.classList.remove('active');
    setTimeout(resizeAndFit, 100);
  }
});

// Controls drawer
const controlsToggle = document.getElementById('controlsToggle');
const controlsDrawer = document.getElementById('controlsDrawer');
const controlsBackdrop = document.getElementById('controlsBackdrop');
controlsToggle.onclick = () => {
  const isOpen = controlsDrawer.classList.toggle('open');
  controlsBackdrop.classList.toggle('open', isOpen);
  controlsToggle.classList.toggle('active', isOpen);
  controlsToggle.textContent = isOpen ? '✕' : '⚙';
  // Trigger resize after transition
  setTimeout(resizeAndFit, 320);
};
controlsBackdrop.onclick = () => {
  controlsDrawer.classList.remove('open');
  controlsBackdrop.classList.remove('open');
  controlsToggle.classList.remove('active');
  controlsToggle.textContent = '⚙';
  setTimeout(resizeAndFit, 320);
};
</script>
</body>
